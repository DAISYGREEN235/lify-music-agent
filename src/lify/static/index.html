<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lify · 场景歌单与试听</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#18302b;background:#f1f5f2;font-size:15px}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:32px 24px 150px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:30px;margin:0 0 8px}h2{font-size:19px;margin:0 0 16px}p{line-height:1.7;margin:8px 0}.muted{color:#61716b;font-size:13px}.badge{padding:7px 12px;background:#dfece5;border-radius:20px;white-space:nowrap}.layout{display:grid;grid-template-columns:340px 1fr;gap:20px}.card{background:#fff;border:1px solid #dde6df;border-radius:16px;padding:22px;margin-bottom:18px}textarea,select,input{font:inherit;width:100%;border:1px solid #cdd9d1;border-radius:9px;padding:10px;background:#fafcfb;outline-color:#27745a}textarea{resize:vertical;min-height:105px}button{font:inherit;cursor:pointer;border:1px solid #cdd9d1;border-radius:8px;padding:9px 12px;background:#fff;color:#23483a}button:hover{background:#eaf3ed}button.primary{background:#236549;color:white;border-color:#236549}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.track{border-top:1px solid #e7ede9;padding:18px 0}.track:first-child{border:0}.track-head{display:flex;justify-content:space-between;align-items:start;gap:14px}.track h3{font-size:16px;margin:0 0 6px}.feedback{display:grid;grid-template-columns:120px 110px 1fr auto;gap:7px;margin-top:12px}.feedback textarea{min-height:42px;height:42px}.reasons{margin-top:10px;line-height:1.6}.player{position:fixed;bottom:0;left:0;right:0;background:#173d30;color:white;padding:18px 24px;box-shadow:0 -6px 30px #14352c1a}.player-inner{max-width:1112px;margin:auto;display:flex;align-items:center;gap:20px}.now{min-width:180px;max-width:300px}.player audio{flex:1;width:100%;min-width:180px}.player button{background:#2d5748;color:white;border-color:#6d8c7c}.notice{background:#fff5dc;color:#765216;border-radius:9px;padding:11px 14px;margin:10px 0}.history{white-space:pre-wrap;max-height:240px;overflow:auto;font-size:13px;line-height:1.7}.empty{padding:30px 0;color:#61716b}label{display:block;font-size:13px;margin:12px 0 7px}#status{min-height:22px;margin:12px 0;color:#376149}@media(max-width:850px){.layout{grid-template-columns:1fr}.feedback{grid-template-columns:1fr 1fr}.player-inner{flex-wrap:wrap;gap:8px}.now{max-width:none}.player audio{flex-basis:100%}main{padding-bottom:200px}}
</style></head><body><main>
<header><div><h1>Lify</h1><p class="muted">描述此刻，找到适合的音乐。在页面里试听，再告诉我哪里合适、哪里需要调整。</p></div><span class="badge">V1.2.0a4 · 受控音频标签与语言证据</span></header>
<div class="layout"><aside>
<section class="card"><h2>想听什么？</h2><textarea id="request" aria-label="推荐需求" placeholder="例如：通勤想振作起来，节奏轻快但不要吵，大约30分钟，约10首。"></textarea>
<div class="actions"><button class="primary" id="generate">新建推荐</button><button id="modify">修改当前需求</button><button id="resume-task">恢复任务</button></div>
<div id="clarify" hidden><p id="question"></p><input id="answer" aria-label="澄清回答" placeholder="补充你的想法"><button id="send-answer" class="primary" style="margin-top:10px">回答</button></div>
<p class="muted">“新建推荐”重新开始；“修改当前需求”保留同一任务的其他条件。生成后等待你点击播放。</p><div id="status" role="status"></div></section>
<section class="card"><h2>已有任务与歌单</h2><select id="tasks" aria-label="已有任务"></select><div class="actions"><button id="load">载入歌单</button><button id="restore-player" disabled>恢复上次位置</button></div><p class="muted">恢复只定位，不自动播放；仍需点击播放按钮。</p></section>
<section class="card"><h2>当前生效条件</h2><div id="constraints" class="muted">载入或生成歌单后显示。</div><p id="ambiguity" class="notice" hidden></p></section>
<section class="card"><h2>我的显式画像</h2><label for="life-stage">生活阶段</label><input id="life-stage" placeholder="例如：学生；可留空"><label for="common-scenes">常用场景（每行一项）</label><textarea id="common-scenes"></textarea><label for="stable-preferences">稳定偏好（每行一项）</label><textarea id="stable-preferences"></textarea><div class="actions"><button id="save-profile">保存画像</button><button id="delete-profile">删除画像</button></div><p class="muted">由你确认，不按年龄猜测。当前需求优先，不修改基础模型。</p><select id="exclusions" aria-label="永久排除的歌曲"></select><button id="undo-exclusion">撤销不再推荐</button></section>
<section class="card"><h2>交互与反馈记录</h2><div id="history" class="history">暂无记录</div><select id="feedback-events" aria-label="可撤销反馈"></select><button id="revoke-feedback">撤销所选反馈</button><div class="actions"><button id="older-history">更早记录</button><button id="export-task">导出本任务</button></div><label for="issue-text">报告使用问题（与歌曲反馈分开）</label><textarea id="issue-text" placeholder="描述操作、现象和预期，不要填写密钥"></textarea><button id="report-issue">保存问题报告</button><p id="language-coverage" class="muted"></p><p id="budget" class="muted"></p><button id="shutdown">停止本地服务</button></section>
</aside><section class="card"><div class="track-head"><div><h2>本次歌单</h2><p id="summary" class="muted">尚未载入歌单</p></div><button id="adjust">按反馈调整歌单</button></div><div id="warnings"></div><div id="playlist"><p class="empty">先描述场景，或载入已有歌单。歌曲的播放和评价都在这里完成。</p></div></section></div>
</main><footer class="player"><div class="player-inner"><div class="now"><strong id="now-title">尚未播放</strong><div id="now-artist" class="muted" style="color:#bbd1c4">选择一首歌开始试听</div></div><audio id="audio" controls preload="none" aria-label="音乐播放器"></audio><button id="previous" disabled>上一首</button><button id="next" disabled>下一首</button></div></footer><script src="/app.js"></script></body></html>
