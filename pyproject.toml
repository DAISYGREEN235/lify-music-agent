[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lify"
version = "1.2.0a4"
description = "本地曲库、可恢复 Agent 与真实播放反馈"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "numpy>=1.26,<3", "mutagen>=1.47,<2", "httpx>=0.27,<1",
  "python-dotenv>=1,<2", "imageio-ffmpeg>=0.6",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
audio = ["torch>=2.6", "transformers>=4.46,<5", "librosa>=0.11,<1", "soundfile>=0.13"]
language = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
browser-test = ["playwright>=1.63,<2"]

[project.scripts]
lify = "lify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lify = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
